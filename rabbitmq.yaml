- name: configure rabbitmq server 
  hosts: rabbitmq
  become: yes 
  tasks:
  - name: set rabbitmq repos 
    ansible.builtin.copy:
      src: rabbitmq.repo 
      dest: /etc/yum.repos.d/rabbitmq.repo 

  - name: install rabbitmq server 
    ansible.builtin.package:
      name: rabbitmq-server 
      state: installed 

  - name: start and enable shipping service
    ansible.builtin.service:
      name: rabbitmq
      state: started 
      enabled: yes 
  - name: set username and password
    community.rabbitmq.rabbitmq_user:
      user: roboshop
      password: roboshop123
      permissions:
        - vhost: /
          configure_priv: .*
          read_priv: .*
          write_priv: .*
      state: present
