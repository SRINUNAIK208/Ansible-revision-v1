- name: configure payment server 
  hosts: payment 
  become: yes 
  tasks:
    - name: install python pakage 
      ansible.builtin.package:
        name: "{{ item }}"
        state: installed 
      loop:
      - python3 
      - gcc 
      - python3-devel 

  
    - name: create system user 
      ansible.builtin.user:
         name: roboshop
         shell: /sbin/nologin 
         system: true 
         home: /app 

    - name: create home directory
      ansible.builtin.file:
        path: /app 
        state: directory 

    - name: Download the application code 
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
        dest: /tmp/payment.zip 

    - name: unarchive the application code 
      ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes 

    - name: install pip3 dependencies
      ansible.builtin.command: pip3 install -r requirements.txt
      args:
       chdir: /app 

    - name: create payment service 
      ansible.builtin.copy:
        src: payment.service
        dest: /etc/systemd/system/payment.service 

    - name: user daemon reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: start and enable payment service
      ansible.builtin.service:
        name: payment
        state: started 
        enabled: yes 