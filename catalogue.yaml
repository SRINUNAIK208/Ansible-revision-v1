- name: configure catalogue server 
  hosts: catalogue 
  become: yes 
  tasks:
    - name: disabled new version and enabled old version 
      ansible.builtin.command: dnf module disable nodejs -y
      ansible.builtin.command: dnf module enable nodejs:20 -y 

    - name: install nodejs 
      ansible.builtin.package:
        name: nodejs 
        state: installed 
    - name: create system user 
      ansible.builtin.user:
         name: roboshop
         shell: /sbin/nologin 
         system: true 
         home: /app 

    - name: create home directory
      ansible.builtin.file:
        path: /app 
        state: directory 

    - name: Download the application code 
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
        dest: /tmp/catalogue.zip 

    - name: unarchive the application code 
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes

    - name: install dependencies 
      community.general.npm:
        path: /app 
        state: present

    - name: create the catalogue service 
      ansible.builtin.copy:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service 

    - name: catalogue daemon reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: start and enable catalogue service
      ansible.builtin.service:
        name: catalogue
        state: started 
        enabled: yes 

    - name: set mongo repo 
      ansible.builtin.copy:
        src: mongo.repo 
        dest: /etc/yum.repos.d/mongo.repo 

    - name: install client 
      ansible.builtin.package:
        name: mongodb-mongosh
        state: installed

    - name: load the catalogue data
      ansible.builtin.shell: mongosh --host mongodb.srinunayak.online </app/db/master-data.js



    