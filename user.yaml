- name: configure catalogue server 
  hosts: user 
  become: yes 
  tasks:
    - name: disabled new version and enabled old version 
      ansible.builtin.command: dnf module disable nodejs -y
      ansible.builtin.command: dnf module enable nodejs:20 -y 

    - name: install nodejs 
      ansible.builtin.package:
        name: nodejs 
        state: installed 
    - name: create system user 
      ansible.builtin.user:
         name: roboshop
         shell: /sbin/nologin 
         system: true 
         home: /app 

    - name: create home directory
      ansible.builtin.file:
        path: /app 
        state: directory 

    - name: Download the application code 
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip 
        dest: /tmp/user.zip 

    - name: unarchive the application code 
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: install dependencies 
      community.general.npm:
        path: /app 
        state: present

    - name: create the user service 
      ansible.builtin.copy:
        src: user.service
        dest: /etc/systemd/system/user.service 

    - name: user daemon reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: start and enable user service
      ansible.builtin.service:
        name: user
        state: started 
        enabled: yes 

    